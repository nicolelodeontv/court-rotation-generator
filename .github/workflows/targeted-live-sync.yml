name: Targeted live-sync tests

on:
  push:
    branches:
      - supabase-switch-20260928
  workflow_dispatch:

jobs:
  targeted-live-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/live-spectator-ranks-share.spec.js --grep "Capacity reached\\.|Payload too large\\.|Two sessions in one tab" --repeat-each=5
