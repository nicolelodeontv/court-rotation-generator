name: Secure live focused debug

on:
  push:
    branches:
      - supabase-switch-20260928

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run secure live spectator tests
        run: |
          npx playwright test tests/live-spectator-ranks-share.spec.js \
            --grep "Live spectator link|Secure publish updates|Transient publish failures|Session ended|RLS returns no rows|hidden host key|runtime Supabase" \
            --workers=1
