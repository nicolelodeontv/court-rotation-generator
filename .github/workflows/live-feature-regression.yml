name: Live feature regression

on:
  push:
    branches: ['fix/live-spectator-and-rank-share']

jobs:
  live-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/live-spectator-rank-share.spec.js tests/actual-duration-upnext-layout.spec.js --reporter=line
