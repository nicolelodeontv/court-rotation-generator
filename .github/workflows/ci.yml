name: Regression checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  javascript-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './tests/*' \
            -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No application JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check "${file}"
          done
